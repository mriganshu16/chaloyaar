# ChaloYaar — Netlify static + functions
[build]
  publish = "."
  functions = "netlify/functions"

# Pretty API path for the Gemini proxy
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true

# Deep links: /trip/:id → SPA with ?trip= (also read from path in JS)
[[redirects]]
  from = "/trip/:id"
  to = "/index.html?trip=:id"
  status = 200
  force = true

[[redirects]]
  from = "/trip/:id/"
  to = "/index.html?trip=:id"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

