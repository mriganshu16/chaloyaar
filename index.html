<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="ChaloYaar — I have X hours from here. What's worth doing? Free, offline-first, no-login trips for riders, drivers & bus travellers." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/logo-mark.svg" />
  <link rel="apple-touch-icon" href="icons/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>ChaloYaar — what's worth doing?</title>
  <style>
    :root {
      --paper: #FEFAF0;
      --paper-2: #F3EDE0;
      --surface: #FFFFFF;
      --ink: #0A0A0A;
      --ink-soft: #2C2924;
      --line: #0A0A0A;
      --lime: #C8FF00;
      --mint: #80EBCA;
      --pink: #FF4D9A;
      --sky: #7EC8FF;
      --purple: #6B4EFF;
      --cream: #FFE8A3;
      --accent: var(--lime);
      --accent-soft: #EAFCC2;
      --green: #0A0A0A;
      --shadow: 3px 3px 0 #0A0A0A;
      --shadow-sm: 2px 2px 0 #0A0A0A;
      --border: 2.5px solid #0A0A0A;
      --r: 14px;
      --r-sm: 10px;
      --r-lg: 18px;
      --space: 16px;
      --section: 20px;
      --ticker-h: 28px;
      --nav-h: 64px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
      line-height: 1.45;
      font-size: 14px;
      overflow-x: hidden;
    }
    h1, h2, h3, .display, .brand, .section-h, .budget-card .label, .route-card .name {
      font-family: "Archivo Black", "Arial Black", Impact, sans-serif;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.1;
      text-transform: lowercase;
    }
    .mono {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; }
    img { max-width: 100%; height: auto; display: block; }
    :focus-visible {
      outline: 3px solid var(--lime);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-top: calc(var(--ticker-h) + var(--safe-t));
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      background-color: var(--paper);
      background-image: radial-gradient(rgba(10, 10, 10, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
      position: relative;
    }

    /* marquee ticker */
    .ticker-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 70;
      height: calc(var(--ticker-h) + var(--safe-t));
      padding-top: var(--safe-t);
      background: #0A0A0A;
      overflow: hidden;
      display: flex;
      align-items: center;
    }
    .ticker {
      display: inline-block;
      white-space: nowrap;
      color: var(--lime);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding-left: 100%;
      animation: marquee 28s linear infinite;
    }
    @keyframes marquee {
      to { transform: translateX(-100%); }
    }

    /* brand block inside app */
    .brand-bar {
      padding: 14px var(--space) 8px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand-home {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: var(--border);
      border-radius: 10px;
      background: #1B2430;
      box-shadow: var(--shadow-sm);
    }
    .brand-word {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: clamp(22px, 7vw, 28px);
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .brand-word .w-chalo { color: var(--ink); }
    .brand-word .w-yaar {
      display: inline-block;
      background: var(--mint);
      color: #0A0A0A;
      border: var(--border);
      padding: 4px 8px 2px;
      transform: rotate(-3deg);
      box-shadow: var(--shadow-sm);
      border-radius: 6px;
    }
    .brand-tagline {
      margin: 8px 0 0;
      font-size: 13px;
      color: var(--ink-soft);
      font-weight: 500;
    }
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .script-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px 6px;
      border: var(--border);
      border-radius: 999px;
      font-family: "Caveat", cursive;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      box-shadow: var(--shadow-sm);
    }
    .script-pill.lime { background: var(--lime); color: #0A0A0A; }
    .script-pill.pink { background: var(--pink); color: #fff; }
    .script-pill.purple { background: var(--purple); color: #fff; }
    .script-pill.mint { background: var(--mint); color: #0A0A0A; }

    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pad {
      padding: 4px max(var(--space), env(safe-area-inset-right, 0px)) 16px max(var(--space), env(safe-area-inset-left, 0px));
    }
    #view { min-height: 40vh; width: 100%; }
    #view.view-enter { animation: viewIn 0.28s ease-out; }

    .block { margin: 0; width: 100%; }
    .block + .block { margin-top: var(--section); }
    .block.block-lg + .block,
    .block + .block.block-lg { margin-top: 24px; }
    .block-head { margin: 0 0 12px; }
    .stack-tight { display: flex; flex-direction: column; gap: 10px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .gap { height: 10px; }
    .gap-lg { height: 0; }
    .logo-card { display: none; }
    .app-header { display: none; }

    .hero-tag, .pill {
      display: inline-block;
      padding: 4px 10px;
      border: var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }
    .pill.green { background: var(--ink); color: var(--lime); }
    .pill.accent { background: var(--lime); color: var(--ink); }
    .pill.pink { background: var(--pink); color: #fff; }

    .greeting {
      margin: 0;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: clamp(22px, 6vw, 28px);
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-transform: lowercase;
    }
    .greeting-sub {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--ink-soft);
      font-weight: 500;
    }

    .card {
      background: var(--surface);
      border: var(--border);
      border-radius: var(--r);
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .card.panel { background: var(--paper-2); box-shadow: var(--shadow-sm); }
    .card.accent-edge {
      border-left: 6px solid var(--mint);
    }
    .card.green-fill {
      background: var(--ink);
      color: #fff;
    }
    .card.green-fill .fine { color: rgba(255,255,255,0.72); }
    .card.offset { transform: none; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 12px 16px;
      border: var(--border); border-radius: var(--r-sm);
      background: var(--lime); color: var(--ink);
      font-weight: 800; font-size: 15px; cursor: pointer;
      text-decoration: none; width: 100%; text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0A0A0A; }
    .btn.secondary {
      background: var(--surface);
      font-weight: 700;
    }
    .btn.green, .btn.ink { background: var(--ink); color: var(--lime); }
    .btn.purple { background: var(--purple); color: #fff; }
    .btn.sm { min-height: 40px; padding: 8px 12px; font-size: 13px; width: auto; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-link {
      background: none; border: none; color: var(--ink);
      font-weight: 700; font-size: 13px; padding: 4px 0; cursor: pointer;
      min-height: 40px; width: auto; text-align: left;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .chip-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: 0 calc(-1 * var(--space));
      padding: 2px var(--space);
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 8px 14px;
      border: var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
    }
    .chip.on {
      background: var(--ink);
      color: var(--lime);
    }
    .chip.ai-add {
      background: var(--paper);
      border-style: dashed;
    }

    .label-sm {
      display: block;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .budget-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .budget-card {
      text-align: left;
      background: var(--surface);
      border: var(--border);
      border-radius: var(--r);
      padding: 14px 12px;
      cursor: pointer;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      animation: cardIn 0.3s ease both;
    }
    .budget-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0A0A0A; }
    .budget-card .label {
      font-size: 15px;
      line-height: 1.15;
    }
    .budget-card .sub {
      font-size: 12px;
      margin-top: 8px;
      color: var(--ink-soft);
      font-weight: 500;
      font-family: "IBM Plex Sans", sans-serif;
      text-transform: none;
      letter-spacing: 0;
    }
    .budget-card.tone-lime { background: var(--lime); }
    .budget-card.tone-sky { background: var(--sky); }
    .budget-card.tone-pink { background: var(--pink); color: #fff; }
    .budget-card.tone-pink .sub { color: rgba(255,255,255,0.85); }
    .budget-card.tone-purple { background: var(--purple); color: #fff; }
    .budget-card.tone-purple .sub { color: rgba(255,255,255,0.85); }
    .budget-card.tone-cream { background: var(--cream); }
    .budget-card:nth-child(5) {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
    }
    .budget-card:nth-child(5) .sub { margin-top: 0; max-width: 55%; text-align: right; }

    .field {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: var(--border);
      border-radius: var(--r-sm);
      background: var(--surface);
      font-size: 15px;
      box-shadow: var(--shadow-sm);
    }
    .field:focus { outline: 3px solid var(--mint); outline-offset: 0; }
    .field.search-like { border-radius: var(--r); }
    textarea.field { min-height: 110px; resize: vertical; }

    .route-list { display: flex; flex-direction: column; gap: 12px; }
    .route-card {
      cursor: pointer;
      text-align: left;
      width: 100%;
      background: var(--surface);
      border: var(--border);
      border-radius: var(--r);
      padding: 0;
      margin: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(84px, 28vw) 1fr;
      min-height: 100px;
      box-shadow: var(--shadow);
      animation: cardIn 0.3s ease both;
    }
    .route-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #0A0A0A; }
    .route-photo {
      background: var(--paper-2);
      background-size: cover;
      background-position: center;
      min-height: 100%;
      border-right: var(--border);
      opacity: 0.8;
      transition: opacity 0.35s ease;
    }
    .route-photo.has-photo { opacity: 1; }
    .route-body {
      padding: 12px 12px 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .route-card .name {
      font-size: 16px;
      line-height: 1.15;
    }
    .route-card .tagline {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--ink-soft);
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .stat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .stat {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
    }
    .badge-ai {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: var(--mint);
      color: #0A0A0A;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tap-affordance { display: none; }

    .place-media { margin: 0 0 14px; }
    .hero-wrap {
      position: relative;
      border: var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--paper-2);
    }
    .hero-photo {
      width: 100%;
      height: clamp(170px, 46vw, 220px);
      object-fit: cover;
      margin: 0;
      touch-action: pan-y;
      user-select: none;
    }
    .btn-expand {
      position: absolute;
      right: 10px;
      bottom: 10px;
      min-height: 36px;
      padding: 6px 12px;
      border: var(--border);
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      width: auto;
    }
    .place-media .photo-credit { margin: 8px 0 10px; }
    .gallery-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 8px;
    }
    .gallery-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 0 4px;
      margin: 0 calc(-1 * var(--space));
      padding-left: var(--space);
      padding-right: var(--space);
    }
    .gallery-strip::-webkit-scrollbar { display: none; }
    .gallery-thumb {
      flex: 0 0 auto;
      width: 74px;
      height: 74px;
      padding: 0;
      border: var(--border);
      border-radius: var(--r-sm);
      overflow: hidden;
      background: var(--paper-2);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }
    .gallery-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-thumb.on {
      outline: 3px solid var(--lime);
      outline-offset: 0;
    }
    .photo-credit {
      font-size: 11px;
      color: var(--ink-soft);
      margin: 0 0 12px;
      font-weight: 500;
    }

    /* lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(10,10,10,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(12px, var(--safe-t)) 12px max(12px, var(--safe-b));
    }
    .lightbox[hidden] { display: none !important; }
    .lightbox-img {
      max-width: 100%;
      max-height: min(72dvh, 640px);
      width: auto;
      height: auto;
      object-fit: contain;
      border: var(--border);
      border-radius: var(--r);
      background: #111;
      box-shadow: 4px 4px 0 var(--lime);
    }
    .lightbox-meta {
      margin-top: 12px;
      color: #fff;
      font-size: 12px;
      text-align: center;
      max-width: 90vw;
    }
    .lightbox-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lightbox-actions .btn { width: auto; min-width: 88px; }

    .section-h {
      font-size: clamp(18px, 5vw, 22px);
      margin: 0 0 6px;
    }
    .section-h.tight { margin-top: 16px; font-size: 18px; }
    .block-head .section-h { margin-top: 0; }
    .block .section-h { margin-top: 18px; }
    .block .section-h:first-child,
    .block-head .section-h { margin-top: 0; }

    .block > p,
    .block .section-h + p {
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      margin: 0 0 10px;
    }
    .list-block li {
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
    }
    .list-block li:last-child { margin-bottom: 0; }
    .list-block li strong { color: var(--ink); font-weight: 800; }

    .banner {
      background: var(--surface);
      border: var(--border);
      border-radius: var(--r);
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .banner.warn { background: #FFE0A3; }
    .banner.ok { background: var(--accent-soft); }

    .topbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .display {
      font-size: clamp(22px, 6vw, 28px);
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 50;
      background: #0A0A0A;
      padding: 0 0 calc(var(--safe-b));
      display: flex;
      justify-content: center;
      border-top: var(--border);
    }
    .nav-inner {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 6px 6px 8px;
    }
    .nav-btn {
      min-height: 52px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
      padding: 6px 2px;
      color: rgba(255,255,255,0.72);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .nav-btn .nav-ico {
      font-size: 16px;
      line-height: 1;
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 800;
    }
    .nav-btn.on {
      background: var(--lime);
      color: #0A0A0A;
      box-shadow: none;
    }

    .muted { color: var(--ink); font-size: 13px; font-weight: 500; opacity: 0.85; }
    .hint { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: var(--ink); opacity: 0.88; }
    .fine { font-size: 14px; line-height: 1.5; color: var(--ink); font-weight: 500; opacity: 0.9; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + 16px + var(--safe-b));
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--lime);
      border: var(--border);
      border-radius: var(--r-sm);
      padding: 10px 16px;
      z-index: 80;
      font-weight: 700;
      font-size: 13px;
      max-width: min(90vw, 360px);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .weather-verdict {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 12px;
      border: var(--border);
      border-radius: 999px;
      background: var(--lime);
      box-shadow: var(--shadow-sm);
    }
    .steps { counter-reset: step; padding-left: 0; list-style: none; }
    .steps li {
      counter-increment: step;
      margin-bottom: 10px;
      padding-left: 36px;
      position: relative;
    }
    .steps li::before {
      content: counter(step);
      position: absolute;
      left: 0; top: 0;
      width: 24px; height: 24px;
      background: var(--lime);
      color: #0A0A0A;
      border: var(--border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      line-height: 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .empty {
      text-align: center;
      padding: 28px 16px;
      border: 2.5px dashed var(--ink);
      border-radius: var(--r);
      background: rgba(255,255,255,0.7);
    }
    .empty .display { font-size: 22px; margin-bottom: 8px; }
    .empty-ico {
      font-size: 42px;
      line-height: 1;
      margin-bottom: 8px;
      filter: grayscale(0.2);
    }

    .dense-block {
      background: var(--ink);
      color: #fff;
      padding: 14px;
      border-radius: var(--r);
      border: var(--border);
      box-shadow: var(--shadow);
    }
    .dense-block .chip {
      background: transparent;
      color: #fff;
      border-color: rgba(255,255,255,0.55);
      box-shadow: none;
    }
    .dense-block .chip.on {
      background: var(--lime);
      border-color: var(--lime);
      color: #0A0A0A;
    }
    .dense-block .label-sm { color: rgba(255,255,255,0.65); }
    .airy { padding: 0; }
    .hero-block .brand { font-size: clamp(26px, 8vw, 34px); }

    @media (max-width: 360px) {
      :root { --space: 12px; --section: 16px; }
      .budget-card { min-height: 96px; padding: 12px 10px; }
      .budget-card .label { font-size: 14px; }
      .route-card { grid-template-columns: 76px 1fr; min-height: 92px; }
      .brand-word { font-size: 20px; }
      .btn { font-size: 14px; min-height: 46px; }
      .nav-btn { font-size: 10px; }
    }
    @media (min-width: 481px) {
      .app, .nav-inner { max-width: 480px; }
      body { background: #E8E0D0; }
      .app { border-left: var(--border); border-right: var(--border); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .ticker { padding-left: 12px; transform: none; }
    }
  </style>
</head>
<body>
  <div class="ticker-wrap" aria-hidden="true">
    <div class="ticker" id="ticker"></div>
  </div>
  <div class="app" id="app">
    <header class="brand-bar">
      <div class="brand-row">
        <a class="brand-home" href="#" id="header-home" aria-label="ChaloYaar home">
          <img class="brand-mark" src="icons/logo-mark.svg" alt="" width="36" height="36" />
          <span class="brand-word" aria-hidden="true"><span class="w-chalo">Chalo</span><span class="w-yaar">Yaar</span></span>
        </a>
      </div>
      <p class="brand-tagline">you've got hours. we've got routes.</p>
      <div class="pill-row">
        <span class="script-pill lime">free · no login</span>
        <span class="script-pill pink">zero planning</span>
      </div>
    </header>
    <main id="view" class="pad" aria-live="polite"></main>
  </div>
  <nav class="nav" aria-label="Main">
    <div class="nav-inner" id="nav"></div>
  </nav>
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Expanded photo">
    <img class="lightbox-img" id="lightbox-img" alt="" />
    <p class="lightbox-meta" id="lightbox-meta"></p>
    <div class="lightbox-actions">
      <button type="button" class="btn sm secondary" id="lightbox-prev">Prev</button>
      <button type="button" class="btn sm" id="lightbox-close">Close</button>
      <button type="button" class="btn sm secondary" id="lightbox-next">Next</button>
    </div>
  </div>
  <div id="toast-host"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
